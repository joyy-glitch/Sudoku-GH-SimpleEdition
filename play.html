<!DOCTYPE html>
<html lang="en">

<!-- Play page: the sudoku board, the symbol buttons, tools (undo, erase, numbers, hint),
     level and difficulty choices, and the pop-up shown when a game ends.
     All the game logic is in js/sudoku.js. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Play - AdinKraze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js"></script>
</head>
<body class="play-page">
    <div class="app">
        <nav class="sidebar" id="sidebar"></nav>

        <main class="main">
            <div class="topbar">
                <div>
                    <h1 id="title">Level 1</h1>
                    <div class="muted" id="subtitle"></div>
                </div>
                <div class="topbar-right">
                    <button class="icon-btn press" onclick="toggleTheme()" aria-label="Switch light or dark mode">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
                    </button>
                </div>
            </div>

            <div class="play-layout">
                <div class="board-col">
                    <div class="card stats-row">
                        <div><span class="muted">Score</span><b class="score" id="scoreText">0</b></div>
                        <div><span class="muted">Best</span><b id="bestText">0</b></div>
                        <div><span class="muted">Mistakes</span><b id="mistakesText">0/3</b></div>
                        <div><span class="muted">Time</span><b id="timeText">00:00</b></div>
                    </div>

                    <div class="board" id="board"></div>
                </div>

                <div class="side-col">
                    <div class="info-card">
                        <div class="label" id="infoLabel">Selected square</div>
                        <h2 id="infoTitle">Empty square</h2>
                        <p id="infoText">Pick a symbol below to place it here.</p>
                    </div>

                    <div class="card tools">
                        <button class="tool" id="undoBtn">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
                            Undo
                        </button>
                        <button class="tool" id="eraseBtn">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M16.5 3.5l4 4L10 18H6l-2-2 12.5-12.5z"/></svg>
                            Erase
                        </button>
                        <button class="tool" id="numbersBtn">
                            <span class="badge off" id="numBadge">OFF</span>
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></svg>
                            Numbers
                        </button>
                        <button class="tool" id="hintBtn">
                            <span class="badge" id="hintBadge">1</span>
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>
                            Hint
                        </button>
                    </div>

                    <div class="palette" id="palette"></div>

                    <div class="card side-settings">
                        <label for="levelSelect" style="margin: 0">Level</label>
                        <select id="levelSelect"></select>
                        <label for="difficultySelect" style="margin: 0">Difficulty</label>
                        <select id="difficultySelect">
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                        <button class="btn btn-primary press" id="newPuzzleBtn">New puzzle</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>

    <!-- pop-up when the game ends -->
    <div class="overlay" id="endOverlay">
        <div class="card modal">
            <div class="kente gold"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <h2 id="endTitle">Ayekoo!</h2>
            <p class="muted" id="endText"></p>
            <div class="modal-buttons">
                <button class="btn btn-outline" id="endAgain">New puzzle</button>
                <a class="btn btn-primary" id="endLink" href="quiz.html">Take the quiz</a>
            </div>
        </div>
    </div>

    <script src="js/sudoku.js"></script>
    <script>
        setupPage();
    </script>
</body>
</html>
