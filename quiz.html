<!DOCTYPE html>
<html lang="en">

<!-- Quiz page: asks the player to match meanings to the symbols they have unlocked.
     All the quiz logic is in js/quiz.js. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz - AdinKraze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js"></script>
</head>
<body>
    <div class="app">
        <nav class="sidebar" id="sidebar"></nav>

        <main class="main">
            <div class="halo"></div>

            <div class="topbar">
                <h1>Symbol quiz</h1>
                <div class="topbar-right">
                    <button class="icon-btn press" onclick="toggleTheme()" aria-label="Switch light or dark mode">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
                    </button>
                </div>
            </div>

            <div class="quiz-wrap">
                <div id="quizArea">
                    <div class="steps" id="steps"></div>

                    <div class="question">
                        <div class="label" id="progress"></div>
                        <h2 id="question"></h2>
                    </div>

                    <div class="options" id="options"></div>

                    <div class="feedback" id="feedback"></div>
                    <button class="btn btn-primary press" id="nextBtn" style="width: 100%; margin-top: 14px">Next question</button>
                </div>

                <div id="resultArea" style="display: none">
                    <div class="card result">
                        <div class="label">Your score</div>
                        <h2 id="resultScore"></h2>
                        <h3 id="resultTitle" style="font-size: 26px"></h3>
                        <p class="muted">Your score has been saved. Keep playing to unlock more symbols.</p>
                    </div>
                    <div class="modal-buttons">
                        <button class="btn btn-outline press" id="againBtn">Try again</button>
                        <a class="btn btn-primary press" href="play.html">Back to puzzles</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>

    <script src="js/quiz.js"></script>
    <script>
        setupQuiz();
    </script>
</body>
</html>
