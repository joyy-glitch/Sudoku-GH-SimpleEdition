<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AdinKraze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js"></script>
</head>

<body>
    <div class="center-page">
        <div class="halo" style="left: 50%; margin-left: -350px"></div>

        <button class="icon-btn press" onclick="toggleTheme()" aria-label="Switch light or dark mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
            </svg>
        </button>

        <div class="hero">
            <div class="hero-symbols" id="heroSymbols"></div>
            <div class="logo" style="padding: 0">Adin<span>Kraze</span></div>
            <h1>Play sudoku.<br><span>Learn Adinkra.</span></h1>
            <p>Every square is a symbol with a story. Solve the puzzle and you'll know what Sankofa, Akoma and Gye Nyame
                mean before you know it.</p>
            <div class="hero-buttons">
                <a class="btn btn-primary press" href="register.html">Sign up free</a>
                <a class="btn btn-outline press" href="login.html">Log in</a>
            </div>
        </div>
    </div>

    <script>
        // if already logged in, go straight to the app
        if (getCurrentUser() != null) {
            window.location.href = "dashboard.html";
        }

        let html = "";
        for (let i = 0; i < 4; i++) {
            html += symbolHtml(symbols[i]);
        }
        document.getElementById("heroSymbols").innerHTML = html;
    </script>
</body>

</html>
